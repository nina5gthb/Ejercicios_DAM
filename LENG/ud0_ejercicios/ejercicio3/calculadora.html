<!DOCTYPE html>
<html lang="es">
    <head>
        <title>Calculadora Nata</title>
        <meta charset="ISO-8859-1">
        <link rel="stylesheet" href="calculadora.css">
    </head>

    <body>
        <table class="calculadora">
            <tr>
                <td colspan="4" class="pantalla">Modelo 01</td>
                <td class="marca">Calcu Nata</td>
            </tr>
        
            <tr>
                <td>c</td><td>1</td><td>2</td><td>3</td>
                <td rowspan="4" class="igual">=</td>
            </tr>
        
            <tr>
                <td>4</td><td>5</td><td>6</td><td>7</td>
            </tr>
        
            <tr>
                <td>8</td><td>9</td><td>0</td><td>%</td>
            </tr>
        
            <tr>
                <td>+</td><td>-</td><td>÷</td><td>x</td>
            </tr>
        </table>
    </body>
</html>
