<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Cosmos</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        <link href="cosmos-copy-style.css" rel="stylesheet">
    </head>

    <body>
        <header>
            <nav> <!--NAV-->
                <ul class="nav-ul">
                    <li class="nav-li"> <img alt="Logo de Cosmos" src="foto-icon.png" height="46" width="53"/> </li>
                    <li class="nav-li"> <a class="button-sin" href="cosmos-copy.html"> Home </a> </li>
                    <li class="nav-li"> <a class="button-sin" href="explore.html"> Explore </a> </li>
                    <li class="nav-li"> <a class="button-sin" href="sequence.html"> Sequence </a> </li>
                    <li class="button-down"> <a class="button-circle" href="#"> Download </a> </li>
                </ul>
            </nav>
        </header>

        <main class="main">
            <div> <!--TEXT-->
                <br> <br> <br> <!--space-->

                <h3> COSMOS </h3>
                <h1 class="main-h1"> Your space for inspiration </h1>
            </div>

            <br> <!--space-->

            <div> <!--BUTTONS-->
                <a class="button-circle" href="#"> Get the app </a>

                <br> <br> <br> <br> <!--space-->

                <button class="button-film" popovertarget="film"> <span> ▶ </span> Watch the new film </button>
                <div id="film" popover> film </div>
            </div>

            <div id="carouselExampleControls" class="carousel slide" data-ride="carousel"> <!--CARROUSEL-->
                <div class="carousel-inner"> <!--images-->
                    <div class="carousel-item active"> <img alt="tigre" src="tigre.jpg" class="d-block mx-auto"/> </div>
                    <div class="carousel-item"> <img alt="colibrí" src="colibrí.jpg" class="d-block mx-auto"/> </div>
                    <div class="carousel-item"> <img alt="animalitos" src="animalitos.jpg" class="d-block mx-auto"/> </div>
                </div>
                
                <!--previous and next-->
                <a class="carousel-control-prev" href="#carouselExampleControls" role="button" data-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="sr-only">Previous</span>
                </a>
                
                <a class="carousel-control-next" href="#carouselExampleControls" role="button" data-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="sr-only">Next</span>
                </a>
            </div>
        </main>
        
        <footer>
            <ul class="social-media"> <!--SOCIAL MEDIA-->
                <li class="social-li"> <a class="button-sin" href="#"> YouTube </a> </li>
                <li class="social-li"> <a class="button-sin" href="#"> Instagram </a> </li>
                <li class="social-li"> <a class="button-sin" href="#"> X </a> </li>
            </ul>

            <ul class="newsletter"> <!--NEWSLETTER-->
                <li> <h3 class="news-h3"> Do you want to stay up to date with the latest news from Cosmos?</h3> </li>
                <li> <p class="news-p"> Join our newsletter: </p> </li>
                <li> <button class="news-button" popovertarget="join-in"> Join in </button> 
                     <div id="join-in" popover>
                         <label for="name"> Name </label>  <input class="join-in-input" id="name" type="text" placeholder="Enter your name">
                         <label for="email"> Email </label> <input class="join-in-input" id="email" type="email" placeholder="Enter your email">
                         <button class="button-circle"> Finish </button>
                     </div> </li>
            </ul>
            
            <p class="cosmos-footer"> COSMOS </p>
        </footer>
        
        <!--BOOTSTRAP-->
        <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"> </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.3/umd/popper.min.js"> </script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.1.3/dist/js/bootstrap.min.js"> </script>
    </body>
</html>
